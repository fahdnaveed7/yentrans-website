# Publishes the site to GitHub Pages.
#
# There is now a build step: the repo root is no longer the artifact. This runs
# the prefixed build, because Pages serves the site from /yentrans-website/
# rather than the domain root, and uploads _site.
#
# Triggers on main only. Pushing a feature branch deploys nothing.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:ghpages
      # The same gate that runs locally. A build with a dead link, a
      # placeholder or an unapproved claim must not reach Pages.
      - run: PATH_PREFIX=/yentrans-website/ npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
