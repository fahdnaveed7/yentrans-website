<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" fill="none">
  <!--
    YML brand mark — recreated as SVG so it scales cleanly across every
    surface (sidebar, favicon, PWA install icon, Office Display, Billing
    Sheet letterhead, login screens). Two layers:
      1. A stylised yacht/sail in cyan-blue tones (left half).
      2. The wordmark "YML" in a light sans-serif (right half).
  -->
  <g transform="translate(10 20)">
    <!-- Yacht sail / hull — a single asymmetric curve, lighter on the
         outer edge and deeper in the centre. Two-tone fill for depth. -->
    <path d="M 4 80 L 165 80 L 130 24 L 56 24 Z"
          fill="#7FBEDF"/>
    <path d="M 56 80 L 165 80 L 130 24 Z"
          fill="#9ECFE3" opacity="0.95"/>
    <!-- Tiny inset bowsprit detail so the boat reads as a yacht and
         not just a triangle. -->
    <path d="M 76 28 L 76 6 L 102 18 Z" fill="#3EA8D6"/>

    <!-- Two wave layers — the classic logo cue. Light blue on top,
         a richer blue underneath; both flow off the left edge of the
         viewBox to keep the silhouette mark-shaped, not boxed. -->
    <path d="M -8 102
             C 24 94, 50 110, 80 102
             S 132 92, 178 104
             L 178 116 L -8 116 Z"
          fill="#A9D5E8"/>
    <path d="M -10 124
             C 28 116, 62 132, 96 124
             S 148 116, 188 126
             L 188 138 L -10 138 Z"
          fill="#6BB7DB"/>
  </g>

  <!-- Wordmark — Helvetica-style sans-serif, lightweight, generous
       letter-spacing so it sits balanced against the icon. -->
  <text x="220" y="108"
        font-family="Helvetica, Arial, 'Liberation Sans', sans-serif"
        font-size="98"
        font-weight="200"
        letter-spacing="2"
        fill="#1F1F1F">YML</text>
</svg>
