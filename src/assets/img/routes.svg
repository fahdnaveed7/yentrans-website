<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img"
     aria-label="Routes radiating from India and the Middle East to destinations worldwide">
  <!--
    Deliberately abstract, not a map. An inaccurate coastline on a shipping
    company's website is worse than no map at all, so this shows the shape of the
    network (two origins, many destinations) without pretending to cartography.
  -->
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38AAE1" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#A2D9F7" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%"  stop-color="#38AAE1" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#38AAE1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Latitude guides: enough structure to read as "world" without claiming geography -->
  <g stroke="#E3E8EC" stroke-width="1" fill="none">
    <path d="M40 120 Q450 86 860 120"/>
    <path d="M40 200 Q450 166 860 200"/>
    <path d="M40 280 Q450 246 860 280"/>
    <path d="M40 360 Q450 326 860 360"/>
  </g>
  <g stroke="#EDF2F6" stroke-width="1" fill="none">
    <path d="M170 70 Q140 230 170 400"/>
    <path d="M340 62 Q330 230 340 406"/>
    <path d="M510 60 Q510 230 510 408"/>
    <path d="M680 62 Q690 230 680 406"/>
  </g>

  <!-- Arcs from the two origin nodes outward -->
  <g fill="none" stroke="url(#arc)" stroke-width="2" stroke-linecap="round">
    <path d="M300 250 C 230 140, 140 120,  70 150"/>
    <path d="M300 250 C 300 130, 380 96,  470 110"/>
    <path d="M300 250 C 400 150, 560 118, 700 140"/>
    <path d="M300 250 C 440 190, 640 168, 830 196"/>
    <path d="M300 250 C 420 268, 620 286, 836 268"/>
    <path d="M300 250 C 380 330, 540 352, 700 336"/>
    <path d="M300 250 C 250 350, 170 372,  92 356"/>
    <path d="M232 214 C 300 120, 420 100, 520 118"/>
    <path d="M232 214 C 180 150, 120 140,  76 158"/>
  </g>

  <!-- Origin nodes: India and the Middle East -->
  <circle cx="300" cy="250" r="26" fill="url(#glow)"/>
  <circle cx="300" cy="250" r="7"  fill="#1B7FB0"/>
  <circle cx="232" cy="214" r="18" fill="url(#glow)"/>
  <circle cx="232" cy="214" r="5"  fill="#1B7FB0"/>
  <text x="300" y="286" text-anchor="middle" font-family="'Source Sans 3',Arial,sans-serif"
        font-size="13" font-weight="600" fill="#0E4A68" letter-spacing=".08em">INDIA</text>
  <text x="206" y="200" text-anchor="end" font-family="'Source Sans 3',Arial,sans-serif"
        font-size="11.5" font-weight="600" fill="#1B7FB0" letter-spacing=".06em">MIDDLE EAST</text>

  <!-- Destination nodes -->
  <g fill="#38AAE1">
    <circle cx="70"  cy="150" r="4.5"/><circle cx="470" cy="110" r="4.5"/>
    <circle cx="700" cy="140" r="4.5"/><circle cx="830" cy="196" r="4.5"/>
    <circle cx="836" cy="268" r="4.5"/><circle cx="700" cy="336" r="4.5"/>
    <circle cx="92"  cy="356" r="4.5"/><circle cx="520" cy="118" r="4"/>
    <circle cx="76"  cy="158" r="4"/>
  </g>
</svg>
